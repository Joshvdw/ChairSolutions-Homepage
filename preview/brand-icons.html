<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: center; }
  .iconset { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .ico { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ico svg { width: 22px; height: 22px; stroke: var(--fg-secondary); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ico span { font-size: 10px; color: var(--fg-muted); letter-spacing: 0.04em; }
  .copy h4 { font-size: 18px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.015em; }
  .copy p { font-size: 13px; color: var(--fg-secondary); line-height: 1.5; margin: 0; }
  .copy code { background: var(--cs-cream-200); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style></head>
<body><div class="card">
  <div class="iconset">
    <div class="ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>search</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span>user</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M6 6h15l-2 11H8z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg><span>cart</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 6 6.5.5-5 4.5L17.5 21 12 17.5 6.5 21l1.5-7-5-4.5L9.5 9z"/></svg><span>star</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v9"/></svg><span>package</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span>check</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h10"/></svg><span>menu</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></svg><span>arrow</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.5L3 21l2-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg><span>chat</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M21 16.9V20a2 2 0 0 1-2.2 2 19.7 19.7 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.7 19.7 0 0 1 1 4.2 2 2 0 0 1 3 2h3.1a2 2 0 0 1 2 1.7l.5 3a2 2 0 0 1-.5 1.8L7 9.7a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 1.8-.5l3 .5a2 2 0 0 1 1.7 2z"/></svg><span>phone</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m3 8 9 6 9-6"/></svg><span>mail</span></div>
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>help</span></div>
  </div>
  <div class="copy">
    <h4>Lucide · 1.5px stroke · outline</h4>
    <p>Iconography is minimal and almost invisible — a handful per page, never accent‑coloured. Always <code>--fg-secondary</code> or <code>--fg-muted</code>. 20 px inline, 24 px standalone.</p>
  </div>
</div></body></html>
