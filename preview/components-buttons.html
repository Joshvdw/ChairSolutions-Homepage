<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 32px; gap: 18px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .btn { font-family: var(--font-sans); font-size: 15px; font-weight: 500; border-radius: 999px; border: 1px solid transparent; padding: 14px 28px; cursor: pointer; transition: all 200ms cubic-bezier(0.22,0.61,0.36,1); letter-spacing: -0.005em; }
  .primary { background: var(--cs-umber-900); color: var(--cs-cream-50); }
  .primary:hover { background: var(--cs-umber-700); transform: scale(1.02); }
  .outline { background: transparent; color: var(--fg-primary); border-color: var(--fg-primary); }
  .outline:hover { background: var(--fg-primary); color: var(--cs-cream-50); }
  .ghost { background: transparent; color: var(--fg-primary); padding: 14px 0; border-radius: 0; }
  .ghost::after { content: ""; display: block; height: 1px; background: currentColor; transform: scaleX(0.4); transform-origin: left; transition: transform 240ms ease-out; }
  .ghost:hover::after { transform: scaleX(1); }
  .lg { padding: 18px 34px; font-size: 16px; }
  .sm { padding: 10px 20px; font-size: 14px; }
  .grp { display: flex; flex-direction: column; gap: 6px; }
  .meta { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.04em; }
</style></head>
<body><div class="card">
  <div class="grp">
    <span class="meta">Primary · umber pill</span>
    <div class="row">
      <button class="btn primary lg">Browse products</button>
      <button class="btn primary">Request a quote</button>
      <button class="btn primary sm">Order samples</button>
    </div>
  </div>
  <div class="grp">
    <span class="meta">Secondary · outlined</span>
    <div class="row">
      <button class="btn outline lg">Speak to our trade team</button>
      <button class="btn outline">See how it works</button>
    </div>
  </div>
  <div class="grp">
    <span class="meta">Tertiary · text link with underline draw</span>
    <div class="row">
      <button class="btn ghost">View all products</button>
      <button class="btn ghost">Download spec sheet</button>
    </div>
  </div>
</div></body></html>
