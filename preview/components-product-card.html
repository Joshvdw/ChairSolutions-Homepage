<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .tile { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(31,26,20,0.05); transition: transform 240ms ease-out, box-shadow 240ms ease-out; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(31,26,20,0.08); }
  .img { aspect-ratio: 4/3; border-radius: 12px; overflow: hidden; position: relative; background: var(--cs-cream-200); }
  .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; top: 12px; left: 12px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--cs-umber-900); color: var(--cs-cream-50); }
  .meta { display: flex; flex-direction: column; gap: 4px; padding: 12px 4px 4px; }
  .eyebrow { font-size: 10px; color: var(--fg-muted); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
  .name { font-size: 15px; font-weight: 600; color: var(--fg-primary); letter-spacing: -0.01em; }
  .price { font-size: 13px; color: var(--fg-secondary); }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="tile">
      <div class="img"><img src="../assets/photos/hospitality.webp" alt=""><span class="badge">Save 18%</span></div>
      <div class="meta">
        <span class="eyebrow">Chair Solutions · NZ</span>
        <span class="name">Aria stack chair · seafoam</span>
        <span class="price">From $189</span>
      </div>
    </div>
    <div class="tile">
      <div class="img"><img src="../assets/photos/healthcare.webp" alt=""></div>
      <div class="meta">
        <span class="eyebrow">Chair Solutions · NZ</span>
        <span class="name">Clinic soft seating · denim</span>
        <span class="price">From $420</span>
      </div>
    </div>
  </div>
</div></body></html>
