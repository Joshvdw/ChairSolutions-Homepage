<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 32px 40px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 14px; align-items: center; }
  .eyebrow { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); }
  .meta { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); text-transform: uppercase; }
  .head { font-size: 26px; font-weight: 600; letter-spacing: -0.018em; line-height: 1.2; color: var(--fg-primary); margin: 6px 0 0; }
  .link { font-size: 16px; color: var(--fg-primary); border-bottom: 1px solid currentColor; padding-bottom: 1px; }
  .arrow { font-size: 16px; color: var(--fg-primary); }
</style></head>
<body><div class="card">
  <div class="stack">
    <div>
      <span class="eyebrow">Trade &amp; commercial</span>
      <div class="head">Built for specifiers</div>
    </div>
    <div class="row" style="margin-top:8px">
      <span class="link">View the full catalogue</span>
      <span class="arrow">→</span>
    </div>
  </div>
</div></body></html>
