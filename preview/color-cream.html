<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 90px; border-radius: 12px; border: 1px solid var(--border-subtle); }
  .name { font-size: 13px; font-weight: 600; color: var(--fg-primary); }
  .hex { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#FBF8F3"></div><div class="name">Cream 50</div><div class="hex">#FBF8F3 · page</div></div>
    <div class="sw"><div class="chip" style="background:#F6F1E8"></div><div class="name">Cream 100</div><div class="hex">#F6F1E8 · surface</div></div>
    <div class="sw"><div class="chip" style="background:#EDE5D6"></div><div class="name">Cream 200</div><div class="hex">#EDE5D6 · hover</div></div>
    <div class="sw"><div class="chip" style="background:#DCD1BC"></div><div class="name">Cream 300</div><div class="hex">#DCD1BC · border</div></div>
  </div>
</div></body></html>
