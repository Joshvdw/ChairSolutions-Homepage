<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; min-height: 100vh; background: var(--cs-cream-50); }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; backdrop-filter: blur(12px) saturate(1.2); background: rgba(251,248,243,0.85); border-bottom: 1px solid var(--border-subtle); }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.04em; color: var(--fg-primary); }
  .links { display: flex; gap: 28px; }
  .links a { font-size: 14px; font-weight: 500; color: var(--fg-primary); }
  .links a:hover { opacity: 0.7; }
  .icons { display: flex; gap: 18px; align-items: center; }
  .icons svg { width: 18px; height: 18px; stroke: var(--fg-primary); }
  .body { padding: 20px 36px; display: flex; flex-direction: column; gap: 6px; }
  .eyebrow { font-size: 11px; color: var(--fg-muted); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
  .note { font-size: 13px; color: var(--fg-secondary); }
</style></head>
<body><div class="card">
  <nav class="nav">
    <div class="logo">Chair Solutions</div>
    <div class="links">
      <a>Shop</a><a>Markets</a><a>Trade</a><a>About</a><a>Contact</a>
    </div>
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-2 11H8z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
    </div>
  </nav>
  <div class="body">
    <span class="eyebrow">Navigation</span>
    <span class="note">Sticky · transparent at top · blurred cream once scrolled · 500‑weight links · no underlines</span>
  </div>
</div></body></html>
