<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px 32px; }
  .scale { display: flex; align-items: flex-end; gap: 14px; height: 140px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { width: 22px; background: var(--cs-umber-300); border-radius: 4px 4px 0 0; }
  .name { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); }
  .px { font-size: 11px; color: var(--fg-primary); font-weight: 600; }
</style></head>
<body><div class="card">
  <div class="scale">
    <div class="col"><div class="bar" style="height:4px"></div><div class="name">1</div><div class="px">4</div></div>
    <div class="col"><div class="bar" style="height:8px"></div><div class="name">2</div><div class="px">8</div></div>
    <div class="col"><div class="bar" style="height:12px"></div><div class="name">3</div><div class="px">12</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="name">4</div><div class="px">16</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="name">5</div><div class="px">24</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="name">6</div><div class="px">32</div></div>
    <div class="col"><div class="bar" style="height:48px"></div><div class="name">7</div><div class="px">48</div></div>
    <div class="col"><div class="bar" style="height:64px"></div><div class="name">8</div><div class="px">64</div></div>
    <div class="col"><div class="bar" style="height:96px"></div><div class="name">9</div><div class="px">96</div></div>
    <div class="col"><div class="bar" style="height:128px"></div><div class="name">10</div><div class="px">128</div></div>
  </div>
</div></body></html>
