<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 90px; border-radius: 12px; border: 1px solid var(--border-subtle); }
  .name { font-size: 13px; font-weight: 600; color: var(--fg-primary); }
  .hex { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); text-transform: uppercase; }
  .badge { position: absolute; top: 22px; right: 32px; font-size: 10px; padding: 4px 10px; border-radius: 999px; background: var(--cs-umber-900); color: var(--cs-cream-50); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
</style></head>
<body><div class="card" style="position:relative">
  <span class="badge">Primary accent</span>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#3B2418"></div><div class="name">Umber 900</div><div class="hex">#3B2418 · CTA</div></div>
    <div class="sw"><div class="chip" style="background:#5A3624"></div><div class="name">Umber 700</div><div class="hex">#5A3624 · hover</div></div>
    <div class="sw"><div class="chip" style="background:#8B5A3C"></div><div class="name">Umber 500</div><div class="hex">#8B5A3C · mid</div></div>
    <div class="sw"><div class="chip" style="background:#C49978"></div><div class="name">Umber 300</div><div class="hex">#C49978 · wash</div></div>
    <div class="sw"><div class="chip" style="background:#EFE0D1"></div><div class="name">Umber 100</div><div class="hex">#EFE0D1 · tint</div></div>
  </div>
</div></body></html>
