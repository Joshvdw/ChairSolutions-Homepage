<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 36px 40px; }
  .specimen { font-size: 96px; line-height: 0.95; font-weight: 700; letter-spacing: -0.025em; color: var(--fg-primary); }
  .meta { display: flex; gap: 24px; margin-top: 18px; align-items: baseline; }
  .name { font-size: 16px; font-weight: 600; color: var(--fg-primary); }
  .sub { font-size: 13px; color: var(--fg-muted); }
</style></head>
<body><div class="card">
  <div class="specimen">Aa Bb · 50</div>
  <div class="meta">
    <span class="name">Plus Jakarta Sans</span>
    <span class="sub">Light 300 · Regular 400 · Medium 500 · Semibold 600 · Bold 700</span>
  </div>
</div></body></html>
