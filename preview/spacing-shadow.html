<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 36px 40px; background: var(--cs-cream-50); }
  .row { display: flex; gap: 32px; align-items: center; justify-content: space-around; }
  .demo { width: 90px; height: 90px; background: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); font-weight: 600; }
  .xs { box-shadow: 0 1px 2px rgba(31,26,20,0.04); }
  .sm { box-shadow: 0 2px 8px rgba(31,26,20,0.06); }
  .md { box-shadow: 0 8px 24px rgba(31,26,20,0.08); }
  .lg { box-shadow: 0 24px 60px rgba(31,26,20,0.12); }
  .lbl { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); text-align: center; margin-top: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="item"><div class="demo xs">xs</div><div class="lbl">borders</div></div>
    <div class="item"><div class="demo sm">sm</div><div class="lbl">cards at rest</div></div>
    <div class="item"><div class="demo md">md</div><div class="lbl">card on hover</div></div>
    <div class="item"><div class="demo lg">lg</div><div class="lbl">overlay · modal</div></div>
  </div>
</div></body></html>
