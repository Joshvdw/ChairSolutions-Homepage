<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 88px; border-radius: 12px; border: 1px solid var(--border-subtle); }
  .name { font-size: 13px; font-weight: 600; color: var(--fg-primary); }
  .hex { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); text-transform: uppercase; }
  .rule { font-size: 14px; color: var(--fg-secondary); line-height: 1.5; max-width: 36ch; }
  .rule strong { color: var(--fg-primary); }
</style></head>
<body><div class="card">
  <div class="wrap">
    <div class="swatches">
      <div class="sw"><div class="chip" style="background:#3A4A5C"></div><div class="name">Denim 700</div><div class="hex">#3A4A5C</div></div>
      <div class="sw"><div class="chip" style="background:#5C7388"></div><div class="name">Denim 500</div><div class="hex">#5C7388</div></div>
      <div class="sw"><div class="chip" style="background:#C8D2DC"></div><div class="name">Denim 200</div><div class="hex">#C8D2DC</div></div>
    </div>
    <p class="rule"><strong>Sparing use only.</strong> Denim is for badges, small UI highlights, and the occasional product callout — never a dominant surface, never a CTA fill, never gradients.</p>
  </div>
</div></body></html>
