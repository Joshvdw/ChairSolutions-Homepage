<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; min-height: 100vh; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; height: 100%; min-height: 100vh; }
  .cell { position: relative; overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 400ms ease-out; }
  .cell:hover img { transform: scale(1.03); }
  .tag { position: absolute; bottom: 10px; left: 12px; font-size: 11px; font-weight: 500; color: #fff; letter-spacing: 0.06em; text-transform: uppercase; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="cell"><img src="../assets/photos/hospitality.webp" alt=""><span class="tag">Hospitality</span></div>
    <div class="cell"><img src="../assets/photos/healthcare.webp" alt=""><span class="tag">Healthcare</span></div>
    <div class="cell"><img src="../assets/photos/boardroom.webp" alt=""><span class="tag">Commercial</span></div>
    <div class="cell"><img src="../assets/photos/education.webp" alt=""><span class="tag">Education</span></div>
    <div class="cell"><img src="../assets/photos/soft-seating.webp" alt=""><span class="tag">Soft seating</span></div>
  </div>
</div></body></html>
